<div class="main-slider-wrapper position-relative">
    <!-- Loading State -->
    <div *ngIf="!sliderData" class="slider-loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">{{ 'SLIDER_LOADING' | translate }}</span>
        </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="sliderData && sliderData.length === 0" class="slider-empty">
        <div class="empty-content">
            <i class="fa-regular fa-images"></i>
            <p>{{ 'NO_SLIDER_IMAGES' | translate }}</p>
        </div>
    </div>

    <!-- Main Slider -->
    <div
        class="main-slider mx-auto"
        *ngIf="sliderData && sliderData.length > 0"
        (mouseenter)="pauseAutoplay()"
        (mouseleave)="resumeAutoplay()"
    >
        <div class="slides-viewport" role="region" [attr.aria-label]="'MAIN_SLIDER' | translate">
            <article
                *ngFor="let slide of sliderData; let i = index; trackBy: trackBySlide"
                class="slide-item"
                [class.is-active]="isSlideActive(i)"
                [attr.aria-hidden]="!isSlideActive(i)"
            >
                <a [href]="slide.link || '#'" class="slide-link" [attr.tabindex]="isSlideActive(i) ? 0 : -1">
                    <div class="image-container">
                        <img
                            [ngSrc]="slide.image_url"
                            class="carousel-image"
                            [alt]="slide.title || 'Slider Image'"
                            [priority]="i === 0"
                            [loading]="i === 0 ? 'eager' : 'lazy'"
                            fill
                            sizes="100vw"
                        />

                        <div class="overlay-content">
                            <div class="content-wrapper" [class.animate-fade-in]="isSlideActive(i)">
                                <h2 class="slide-title" *ngIf="slide.title">
                                    {{ slide.title }}
                                </h2>
                                <p class="slide-description" *ngIf="slide.description">
                                    {{ slide.description }}
                                </p>
                                <div class="slide-cta" *ngIf="slide.link">
                                    <span class="cta-button">
                                        {{ 'READ_MORE' | translate }}
                                        <i
                                            class="fa-solid ms-2"
                                            [ngClass]="{'fa-arrow-right': translate.currentLang === 'en', 'fa-arrow-left': translate.currentLang === 'ar'}"
                                        ></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </article>
        </div>

        <!-- Custom Navigation Buttons -->
        <div class="custom-nav" *ngIf="sliderData.length > 1">
            <button class="nav-btn prev-btn" (click)="prevSlide()" [attr.aria-label]="'PREVIOUS' | translate">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="nav-btn next-btn" (click)="nextSlide()" [attr.aria-label]="'NEXT' | translate">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="slider-dots" *ngIf="sliderData.length > 1">
            <button
                *ngFor="let slide of sliderData; let i = index; trackBy: trackBySlide"
                type="button"
                class="slider-dot"
                [class.is-active]="isSlideActive(i)"
                [attr.aria-label]="'Go to slide ' + (i + 1)"
                [attr.aria-current]="isSlideActive(i)"
                (click)="goToSlide(i)"
            ></button>
        </div>
    </div>
</div>
