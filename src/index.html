<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="Online Islamic Madrasah for Quran memorization, Tajweed, Arabic language, and Islamic studies with qualified teachers." />

    <!-- Title -->
    <title>Online Islamic Madrasah | Quran And Arabic Learning</title>

    <!-- Source Connectivity -->
    <link rel="preconnect" href="https://dashboard.onlineislamicmadrasah.com" crossorigin />
    <link rel="dns-prefetch" href="//dashboard.onlineislamicmadrasah.com" />
    <link rel="preload" href="/assets/i18n/en.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="https://dashboard.onlineislamicmadrasah.com/api/settings" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="https://dashboard.onlineislamicmadrasah.com/api/main-sliders" as="fetch" crossorigin="anonymous" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/logo.svg" />
</head>

<body>
    <div id="loading-screen">
        <img src="assets/images/logo_optimized.svg" alt="Loading..." width="150" height="50" fetchpriority="high" />
    </div>
    <app-root></app-root>
    <script>
        window.addEventListener('load', function () {
            window.setTimeout(function () {
                document.body.classList.add('loaded');
            }, 250);
        }, { once: true });
    </script>
</body>

</html>
